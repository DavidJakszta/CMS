services:
  cms:
    image: ${CMS_IMAGE:-ghcr.io/anomalyco/cms}:${IMAGE_TAG:-latest}
    container_name: cms
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:?err}
      - Jwt__Key=${JWT_KEY:?err}
      - Jwt__Issuer=${JWT_ISSUER:-CMS.Server}
      - Jwt__Audience=${JWT_AUDIENCE:-CMS.Client}
      - Jwt__ExpireMinutes=${JWT_EXPIRE_MINUTES:-60}
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - cms-network

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
