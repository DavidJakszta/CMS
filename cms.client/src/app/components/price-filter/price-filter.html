<div class="price-filter">
  <span class="filter-label">Price range:</span>
  <input type="number" min="0" step="0.01" placeholder="Min" [(ngModel)]="min" />
  <span class="filter-sep">&ndash;</span>
  <input type="number" min="0" step="0.01" placeholder="Max" [(ngModel)]="max" />
  <button (click)="apply()">Apply</button>
  <button class="btn-outline" (click)="reset()">Clear</button>
</div>
