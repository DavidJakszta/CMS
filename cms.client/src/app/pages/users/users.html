<h2>Users</h2>

<div *ngIf="error" class="errors"><p>{{ error }}</p></div>

<div>
  <input type="text" [(ngModel)]="search" (input)="applyFilter()" placeholder="Search by display name..." />
</div>

<div *ngIf="loading">Loading...</div>

<div class="users-layout" *ngIf="!loading && filteredUsers.length">
  <table>
    <thead>
      <tr>
        <th>User</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of pagedUsers" [routerLink]="['/users', user.id]" class="clickable-row">
        <td>
          <span class="avatar avatar-sm">{{ avatarFor(user.displayName) }}</span>
          {{ user.displayName || 'Unnamed' }}
        </td>
      </tr>
    </tbody>
  </table>

  <app-pagination
    [totalItems]="filteredUsers.length"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    (pageSizeChange)="onPageSizeChange($event)"
    (pageChange)="onPageChange($event)">
  </app-pagination>
</div>

<p *ngIf="!loading && !filteredUsers.length">No users found.</p>
