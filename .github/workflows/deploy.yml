name: Build, Push, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (defaults to git sha)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_VERSION: "10.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=ref,event=branch

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  migrate:
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore NuGet packages
        run: dotnet restore CMS.Server/CMS.Server.csproj

      - name: Run database migrations
        id: migrate
        env:
          DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          echo "Starting database migration at $(date)" > migration-log.txt
          echo "" >> migration-log.txt

          dotnet ef database update \
            --project CMS.Server/CMS.Server.csproj \
            --connection "$DB_CONN" 2>&1 | tee -a migration-log.txt

          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE" >> migration-log.txt
          if [ $EXIT_CODE -ne 0 ]; then exit $EXIT_CODE; fi

      - name: Upload migration log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log-${{ github.sha }}
          path: migration-log.txt

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy folder to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/"
          target: "~/cms"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # add swap (Oracle free tier has only ~500MB RAM; dnf/docker installs get OOM-killed without it)
            SWAP_MB=$(free -m | awk '/^Swap:/{print $2}')
            if [ "${SWAP_MB:-0}" -lt 2048 ] && ! swapon --show | grep -q '^/swapfile '; then
              sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile >/dev/null
              sudo swapon /swapfile
              if ! grep -q '/swapfile' /etc/fstab; then
                echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
              fi
            fi
            
            # install docker + compose plugin if missing
            if ! command -v docker &>/dev/null; then
              sudo dnf install -y dnf-utils
              sudo dnf config-manager --add-repo https://download.docker.com/linux/ol/docker-ce.repo
              sudo dnf install -y docker-ce docker-ce-cli containerd.io
              sudo systemctl enable --now docker
              sudo usermod -aG docker $USER
            fi
            if ! docker compose version &>/dev/null; then
              sudo dnf install -y docker-compose-plugin
            fi

            cd ~/cms/deploy

            export DB_CONNECTION_STRING="${{ secrets.DB_CONNECTION_STRING }}"
            export JWT_KEY="${{ secrets.JWT_KEY }}"
            export JWT_ISSUER="${{ secrets.JWT_ISSUER }}"
            export JWT_AUDIENCE="${{ secrets.JWT_AUDIENCE }}"
            export IMAGE_TAG="sha-${{ github.sha }}"
            export GHCR_USER="${{ github.actor }}"
            export GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"

            bash deploy.sh
